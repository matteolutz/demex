[workspace]
members = [
    "crates/demex_dmx",
    "crates/demex_headless",
    "crates/demex_core",
    "crates/demex",
    "crates/demex_gpui",
    "crates/tree-sitter-demex"
    ] # crates/demex_gpui, crates/demex_ui
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
demex_dmx = { path = "./crates/demex_dmx" }
demex_headless = { path = "./crates/demex_headless" }
demex_core = { path = "./crates/demex_core" }
demex_gpui = { path = "./crates/demex_gpui" }
demex = { path = "./crates/demex" }

tree-sitter-demex = { path = "./crates/tree-sitter-demex" }

ecolor = { version = "0.31.1", features = ["serde"] }
emath = { version = "0.31.1", features = ["serde"] }

byteorder = "1.5.0"
chrono = "0.4.39"
clap = { version = "4.5.28", features = ["derive"] }
env_logger = "0.11.6"
gdtf = { version = "0.2.0" }
interpolator = "0.5.0"
itertools = "0.13.0"
lazy_static = "1.5.0"
log = "0.4.26"
midir = { version = "0.10.1", features = ["winrt"] }
parking_lot = { features = ["deadlock_detection"], version = "0.12.3" }
rand = "0.8.5"
ref-map = "0.1.3"
regex = "1.11.1"

serialport = { version = "4.8.1", features = ["serde"] }

serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"

strum = { version = "0.27.0", features = ["derive"] }
strum_macros = "0.27.0"
uuid = "1.16.0"
ciborium = "0.2.2"
nalgebra = "0.33.2"
